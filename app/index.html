<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MotoCine" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Orion MotoCine</title>
    <!-- Modo oscuro: se decide ANTES de pintar (sin parpadeo blanco) y sigue
         al celular. Mismo criterio que Orion POS: el CSS solo mira
         data-theme="light" | "dark" en <html>. -->
    <script>
      (function () {
        function aplicar() {
          try {
            var oscuro = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.setAttribute("data-theme", oscuro ? "dark" : "light");
            var barra = document.querySelector('meta[name="theme-color"]');
            if (barra) barra.setAttribute("content", oscuro ? "#000000" : "#f6f6f3");
          } catch (e) {}
        }
        aplicar();
        try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", aplicar); } catch (e) {}
      })();
    </script>
    <style>
      html, body { background: #f6f6f3; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #000; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
